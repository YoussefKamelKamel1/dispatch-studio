name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    env:
      AI_MODE: demo
      OPENAI_API_KEY: ""
      WEBSITE_PROVIDER: local
      SOCIAL_PROVIDER: sandbox
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -r requirements.txt
      - name: Backend checks
        run: python -m pytest -q --basetemp=.test-tmp
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start application
        run: |
          python run.py --port 8012 --data-dir .ci-data > app.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8012/api/health; then exit 0; fi
            sleep 1
          done
          cat app.log
          exit 1
      - name: Browser workflows
        working-directory: frontend
        run: npm run test:e2e
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-results
          path: |
            frontend/test-results/
            app.log
